name: Update playable branch preview
on:
  push:
    branches:
      - feature/player-class-selection
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Check out stable site
        uses: actions/checkout@v4
        with:
          ref: main
          path: stable
          persist-credentials: true
      - name: Check out development branch
        uses: actions/checkout@v4
        with:
          ref: feature/player-class-selection
          path: development
      - name: Refresh preview without changing stable game
        run: |
          mkdir -p stable/preview
          cp development/index.html development/style.css development/game.js stable/preview/
      - name: Commit preview if changed
        working-directory: stable
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview/
          if ! git diff --cached --quiet; then
            git commit -m "Update browser playtest preview"
            git push origin HEAD:main
          fi
